<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    How the fonts on the remote screen are drawn.

    Wine does not decide by itself how a letter is to look on the screen:
    it asks fontconfig for the font and for the way that font is to be
    drawn, and fontconfig's answer is what ends up on the screen. The
    stock answer in this image is "no antialiasing", so the program's own
    text comes out with hard, jagged edges - and the settings in the
    Windows registry (FontSmoothing, FontSmoothingType, ...) have no
    effect on it, they were tried.

    What is set here is what the FreeBSD handbook recommends for Wine:
    antialiasing on, slight hinting, and subpixel (RGB) rendering - the
    same thing Windows itself does with ClearType.

    The file is copied to /etc/fonts/local.conf when the image is built.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
